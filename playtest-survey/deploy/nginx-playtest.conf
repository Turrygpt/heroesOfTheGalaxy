# Вставить внутрь HTTPS-сервера turrium.ru до общего location /.
location = /playtest {
    access_log off;
    return 301 /playtest/;
}

location = /playtest/api/submit {
    access_log off;
    client_max_body_size 24k;
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8127/submit;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
}

location = /playtest/api/session {
    access_log off;
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8127/session;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
}

location ^~ /playtest/ {
    access_log off;
    autoindex off;
    root /var/www/turrium.ru;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
}
